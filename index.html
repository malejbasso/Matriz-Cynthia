<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Mis matrices de comunicación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Concepto: una mesa de trabajo clínica y tranquila. Fondo verde-gris, acento verde azulado profundo.
   Los colores de la matriz (amarillo, naranja, gris) son los del instrumento original y no cambian con el tema. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface2:#e8efee; --ink:#14262a; --muted:#566a6e; --line:#d1dbda;
  --accent:#0c6670; --accent-ink:#ffffff; --accent-soft:#d8eeee; --danger:#b3261e; --danger-soft:#fbe4e2;
  --warn-bg:#fff2d1; --warn-ink:#5a4300; --ok:#1f7a3f;
  --m-none:#ffffff; --m-emerg:#fde37f; --m-dom:#fba97d; --m-sup:#cfcfcf; --m-head:#707777; --m-ink:#1a1a1a; --m-line:#6b7474;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1718; --surface:#172326; --surface2:#1f2f32; --ink:#e5eeee; --muted:#9db0b2; --line:#2b3d40;
    --accent:#5cc6cb; --accent-ink:#04282b; --accent-soft:#133a3d; --danger:#ff8a80; --danger-soft:#3b1f1d;
    --warn-bg:#3b3012; --warn-ink:#f3dc9a; --ok:#6fd08f; --m-none:#172326; --m-head:#4a5557; --m-line:#8b9697;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1718; --surface:#172326; --surface2:#1f2f32; --ink:#e5eeee; --muted:#9db0b2; --line:#2b3d40;
  --accent:#5cc6cb; --accent-ink:#04282b; --accent-soft:#133a3d; --danger:#ff8a80; --danger-soft:#3b1f1d;
  --warn-bg:#3b3012; --warn-ink:#f3dc9a; --ok:#6fd08f; --m-none:#172326; --m-head:#4a5557; --m-line:#8b9697;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-block:22px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);line-height:1.1}
h2{font-size:1.45rem;line-height:1.2}
h3{font-size:1.05rem}
p{margin:0}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.95rem;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:12px 16px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.banner.err{background:var(--danger-soft);color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.tool{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.tool input[type=search]{flex:1 1 240px;min-width:0}
input[type=text],input[type=search],input[type=date],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.citem{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
.crow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.crow .citem{flex:1 1 260px;width:auto}
.crow .row-actions{align-items:center}
.citem:hover{border-color:var(--accent)}
.citem .nm{font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--surface2);font-size:.8rem;font-weight:600;color:var(--muted)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.2rem;margin-bottom:6px}
.crumb{margin-bottom:12px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.row-actions{display:flex;flex-wrap:wrap;gap:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.ev{border-collapse:collapse;width:100%;min-width:760px}
table.ev th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
table.ev td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ev tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
/* Asistente */
.wz-head{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end;margin-bottom:18px}
.wz-head .f{flex:0 1 190px}
.wz-prog{flex:1 1 220px;display:grid;gap:5px;min-width:180px}
.saved{font-size:.82rem;color:var(--ok);min-width:110px}
.saved.bad{color:var(--danger);font-weight:600}
.wiz{display:grid;grid-template-columns:268px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.wiz{grid-template-columns:minmax(0,1fr)}}
.nav{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.nav summary{cursor:pointer;font-weight:700;padding:8px;font-family:var(--f-display)}
@media (min-width:901px){.nav{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.nav .stg{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 8px 3px;font-weight:700}
.nav button{display:flex;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:.9rem;align-items:center}
.nav button:hover{background:var(--surface2)}
.nav button.cur{background:var(--accent-soft);font-weight:700}
.nav .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);flex:none}
.nav .dot.done{background:var(--accent);border-color:var(--accent)}
.nav .dot.no{background:var(--m-sup);border-color:var(--m-sup)}
.step-top{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.code{font-family:var(--f-display);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:2px 10px;font-size:.95rem}
.q{font-size:1.08rem;margin:10px 0 16px;max-width:70ch}
.yn{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.yn label{position:relative;cursor:pointer}
.yn input{position:absolute;opacity:0;inset:0}
.yn span{display:inline-block;min-width:92px;text-align:center;padding:10px 20px;border:1.5px solid var(--line);border-radius:9px;font-weight:700;background:var(--surface)}
.yn input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.yn input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.behs{margin-top:22px;display:grid;gap:18px}
.sub{font-family:var(--f-display);font-size:1.12rem;margin-bottom:-4px}
fieldset.cat{border:1px solid var(--line);border-radius:10px;padding:0;margin:0;min-width:0;overflow:hidden}
fieldset.cat legend{display:block;width:100%;padding:0;float:none}
.cat-h{background:var(--surface2);padding:8px 14px;font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cat-h small{font-weight:600;color:var(--muted)}
.beh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
fieldset.cat legend + .beh{border-top:0}
.bl{min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg label{position:relative;cursor:pointer;display:block}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;padding:7px 12px;font-size:.86rem;border-left:1px solid var(--line);white-space:nowrap}
.seg label:first-child span{border-left:0}
.seg input:checked + span{font-weight:700}
.seg .s0 input:checked + span{background:var(--surface2)}
.seg .s1 input:checked + span{background:var(--m-emerg);color:var(--m-ink)}
.seg .s2 input:checked + span{background:var(--m-dom);color:var(--m-ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:640px){.beh{grid-template-columns:minmax(0,1fr)}.seg{display:flex}.seg label{flex:1}.seg span{padding:9px 4px;text-align:center;white-space:normal;font-size:.8rem}}
details.cm{padding:8px 14px 12px;border-top:1px solid var(--line)}
details.cm summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
details.cm textarea{margin-top:8px}
.foot-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:26px}
.gate-opts{display:grid;gap:10px;margin-top:16px}
.gate-opts label{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.gate-opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.gate-opts input{margin-top:4px;accent-color:var(--accent)}
.gate-box{background:var(--surface2);border-radius:10px;padding:14px 18px;margin-top:12px}
.gate-box ul{margin:8px 0 0;padding-left:20px}
/* Resultado */
.res-actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);border-left:8px solid var(--line)}
.kpi b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.kpi.k1{border-left-color:var(--m-emerg)}.kpi.k2{border-left-color:var(--m-dom)}.kpi.k3{border-left-color:var(--m-sup)}
.mxscroll{overflow-x:auto;padding-bottom:8px}
.mx{display:grid;grid-template-columns:150px repeat(17,minmax(50px,1fr));gap:4px;min-width:1060px}
.mx .lv{grid-column:1;background:var(--m-head);color:#fff;border-radius:3px;padding:6px 9px;font-size:.72rem;display:flex;flex-direction:column;justify-content:center}
.mx .lv b{font-size:.86rem}
.mx .cell{border:1px solid var(--m-line);border-radius:2px;padding:4px 3px;font-size:.66rem;line-height:1.15;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:78px;cursor:pointer}
.mx .cell b{font-size:.8rem}
.mx .cell{overflow-wrap:anywhere;hyphens:auto}
.mx .grp{font-size:.7rem!important;background:var(--m-head);color:#fff;font-weight:600;text-align:center;padding:8px 4px;border-radius:2px;font-size:.85rem}
.st0{background:var(--m-none);color:var(--ink)}
.st1{background:var(--m-emerg);color:var(--m-ink)}
.st2{background:var(--m-dom);color:var(--m-ink)}
.st3{background:var(--m-sup);color:var(--m-ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:6px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:8px;font-size:.9rem}
.legend i{width:20px;height:20px;border:1px solid var(--m-line);border-radius:3px;display:inline-block}
.site-foot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.85rem;line-height:1.35;padding:7px 16px calc(7px + env(safe-area-inset-bottom,0px))}
.wrap{padding-bottom:96px!important}
.mx button.lv{border:0;text-align:left;cursor:pointer;font:inherit;font-size:.72rem;color:#fff}
.mx button.lv:hover{filter:brightness(1.18)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid var(--m-line);white-space:nowrap}
.dtabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dtabs button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600}
.dtabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dchart{position:relative;height:320px}
details.help{background:var(--surface2);border-radius:10px;padding:10px 14px}
details.help summary{cursor:pointer;font-weight:700;color:var(--accent)}
details.help ul{margin:8px 0;padding-left:20px}
.dl h3{margin:16px 0 6px}
.dl ul{margin:6px 0;padding-left:20px}
.dm-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
.nt{color:#b00020;font-weight:700}
.dsh{display:flex;flex-direction:column;gap:18px}
.dg{display:flex;flex-wrap:wrap;gap:18px}
.dc{flex:1 1 300px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.dc h2{margin:0;font-size:1.05rem}
.dc .eb{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ins{flex:1 1 240px;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.ins i{width:8px;height:34px;border-radius:5px;flex:none}
.ins small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.dbar{display:flex;height:100%;border-radius:8px;overflow:hidden;background:var(--surface2)}
.lvrow{display:flex;align-items:center;gap:12px}
.lvrow .nm{flex:none;width:136px;font-size:.88rem;line-height:1.2}
.lvrow .nm small{display:block;color:var(--muted)}
.lvrow .bx{flex:1;min-width:0;height:26px}
.lvrow .vl{flex:none;width:68px;text-align:right;font-weight:700;font-size:.88rem}
.heat{overflow-x:auto}
.heat .hg{min-width:860px;display:grid;grid-template-columns:116px repeat(17,minmax(0,1fr));gap:3px}
.hc{border:0;border-radius:7px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#14262a;cursor:pointer;padding:2px;font-family:inherit}
.hc b{font-size:.62rem;opacity:.75}.hc span{font-size:.8rem;font-weight:700}
.hl{display:flex;flex-direction:column;justify-content:center;font-size:.8rem;padding-right:6px;line-height:1.2}
.hl small{color:var(--muted);font-size:.7rem}
.hn{text-align:center;font-size:.7rem;font-weight:700;color:var(--muted)}
.zrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;width:100%;text-align:left;font-family:inherit;color:inherit}
.chipd{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:99px}
.chipd.neg{background:var(--danger-soft);color:var(--danger)}
.chipd.neu{background:var(--surface2);color:var(--muted)}
.stp{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.stp div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;color:var(--muted)}
.stp b{min-width:42px;box-sizing:border-box;text-align:center;padding:9px 0;border-radius:11px;color:#14262a;font-size:.9rem}
.lgd{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted)}
.lgd i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.notes-list{list-style:none;padding:0;margin:10px 0 0}.notes-list li{margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line,#ddd)}
.dm-note{font-size:.88rem;color:var(--muted);font-style:italic;margin:2px 0 6px}
.kpi small{font-size:.9rem;font-weight:600;color:var(--muted)}
#modal .box.wide{max-width:640px}
#modal .box{max-height:88vh;overflow:auto}

#modal{position:fixed;inset:0;background:rgba(10,20,22,.55);display:grid;place-items:center;padding:20px;z-index:50}
#modal[hidden],#toast[hidden]{display:none}

@media (prefers-reduced-motion:no-preference){.card,.citem{transition:border-color .15s}}

<script>
'use strict';
/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fmtDate = iso => { if (!iso) return '—'; const [y,m,d] = iso.split('-'); return d + '/' + m + '/' + y; };
const slug = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || 'nino';
function ageText(dob, at) {
  if (!dob) return '';
  const a = new Date(dob + 'T00:00:00'), b = new Date((at || today()) + 'T00:00:00');
  let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (b.getDate() < a.getDate()) m--;
  if (m < 0) return '';
  const y = Math.floor(m / 12), r = m % 12;
  const ys = y + (y === 1 ? ' año' : ' años'), rs = r + (r === 1 ? ' mes' : ' meses');
  return y && r ? ys + ' y ' + rs : y ? ys : rs;
}

/* ============ Almacenamiento local (con respaldo exportable) ============ */
const LS_KEY = 'matrices-comunicacion.v1';
let storageOk = true;
function blankDb() { return { v: 1, children: [], evals: [], lastBackup: 0, evaluator: '' }; }
function loadDb() {

const FILE_NAME = 'matrices.json';
const fsSupported = typeof window.showDirectoryPicker === 'function' && window.isSecureContext;
let dirH = null, fileSt = fsSupported ? 'need' : 'unsupported', writeT, writing = false, again = false;
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('matrices-fs', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k) { try { const d = await idb(); return await new Promise(r => { const q = d.transaction('h').objectStore('h').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch (e) { return null; } }
async function idbSet(k, v) { try { const d = await idb(); await new Promise(r => { const t = d.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = () => r(); t.onerror = () => r(); }); } catch (e) {} }
async function readFileDb() { const fh = await dirH.getFileHandle(FILE_NAME, { create: true }); const t = await (await fh.getFile()).text(); return t.trim() ? JSON.parse(t) : null; }
const validDb = d => d && Array.isArray(d.children) && Array.isArray(d.evals);
async function writeFileDb() {
  if (!dirH || fileSt !== 'ok') return;
  if (writing) { again = true; return; }
  writing = true;
  try { const fh = await dirH.getFileHandle(FILE_NAME, { create: true }); const w = await fh.createWritable(); await w.write(JSON.stringify(db, null, 1)); await w.close(); }
  catch (e) { fileSt = 'err'; }
  writing = false; if (again) { again = false; writeFileDb(); }

}
function scheduleWrite() { if (fileSt !== 'ok') return; clearTimeout(writeT); writeT = setTimeout(writeFileDb, 400); }
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(writeT); writeFileDb(); } });
function replaceDb(d) { db = Object.assign(blankDb(), d); }
function mergeDb(d) {
  d.children.forEach(c => { const i = db.children.findIndex(x => x.id === c.id); if (i < 0) db.children.push(c); else db.children[i] = Object.assign(db.children[i], c); });
  d.evals.forEach(e => { const i = db.evals.findIndex(x => x.id === e.id); if (i < 0) db.evals.push(e); else if ((e.updated || 0) > (db.evals[i].updated || 0)) db.evals[i] = e; });
}
async function attachFolder(interactive) {
  let d = null;
  try { d = await readFileDb(); } catch (e) { fileSt = 'err'; toast('No se pudo leer ' + FILE_NAME + ' (¿archivo dañado?). No se modificó.'); return false; }
  const fileHas = validDb(d) && (d.children.length || d.evals.length), localHas = db.children.length || db.evals.length;
  if (fileHas) {
    const same = JSON.stringify(d.evals.map(e => e.id + ':' + e.updated).sort()) === JSON.stringify(db.evals.map(e => e.id + ':' + e.updated).sort()) && d.children.length === db.children.length;
    if (localHas && !same && interactive) {
      const r = await modal(`<p><b>La carpeta ya tiene un ${FILE_NAME}</b> con ${d.children.length} niños/as y ${d.evals.length} evaluaciones, y este navegador tiene datos distintos (${db.children.length} y ${db.evals.length}).</p><div class="acts"><button class="btn" data-v="no">Cancelar</button><button class="btn" data-v="mer">Combinar</button><button class="btn primary" data-v="file">Usar el de la carpeta</button></div>`);
      if (r === 'file') replaceDb(d); else if (r === 'mer') mergeDb(d); else return false;
    } else if (!localHas || !interactive) replaceDb(d);

}
async function connectFolder(forcePick) {
  const prev = dirH, prevSt = fileSt;
  try {
    let h = forcePick ? null : dirH;
    if (h) { const p = await h.requestPermission({ mode: 'readwrite' }); if (p !== 'granted') h = null; }
    if (!h) h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'matrices' });
    dirH = h;
    if (await attachFolder(true)) { await idbSet('dir', h); toast('Guardando en la carpeta «' + h.name + '» → ' + FILE_NAME); }
    else { dirH = prev; fileSt = prevSt; }
  } catch (e) { dirH = prev; fileSt = prevSt; if (!(e && e.name === 'AbortError')) { toast('No se pudo acceder a la carpeta: ' + (e && e.message || e)); } }
  render();
}
async function initFolder() {
  if (!fsSupported) return seedFromSite();
  dirH = await idbGet('dir');
  if (!dirH) return seedFromSite();
  try { if ((await dirH.queryPermission({ mode: 'readwrite' })) === 'granted') { await attachFolder(false); } } catch (e) { dirH = null; }
  if (ui.view === 'home') render();
}
async function seedFromSite() {
  if (db.children.length || db.evals.length || !/^https?:$/.test(location.protocol)) return;
  try { const r = await fetch(FILE_NAME + '?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return; const d = await r.json();
    if (validDb(d) && (d.children.length || d.evals.length)) { replaceDb(d); persist(); if (ui.view === 'home') render(); toast('Datos cargados desde ' + FILE_NAME + ' del sitio'); } } catch (e) {}
}

  if (fileSt === 'need') return '<div class="banner"><span><b>Conecta la carpeta donde está este HTML</b> para guardar todo en <b>' + FILE_NAME + '</b>. Se pide una vez por sesión (' + (dirH ? 'ya la elegiste antes: solo debes permitir el acceso' : 'elige la carpeta del archivo') + ').</span><button class="btn sm primary" data-act="connect">' + (dirH ? 'Permitir acceso' : 'Elegir carpeta') + '</button></div>';

function newEval(childId, src) {
  const e = { id: uid(), childId, date: today(), evaluator: db.evaluator || '', created: Date.now(), updated: Date.now(),
    ans: {}, beh: {}, comments: {}, gates: { g1: 'si', g2: 'si', g3: 'si' }, ov: {} };
  if (src) { e.ans = Object.assign({}, src.ans); e.beh = Object.assign({}, src.beh); e.gates = Object.assign({}, src.gates); e.ov = Object.assign({}, src.ov); e.from = src.id; }
  db.evals.push(e); persist(); return e;
}
function stOf(ev, key) {
  const f = cellFun(key), L = key.includes('@') ? +key.split('@')[1] : 0;
  if (f.kind === 'A') { if (ev.gates.g1 === 'superado') return 3; if (ev.gates.g1 !== 'si') return 0; }
  if (f.kind === 'B') { const g = ev.gates.g2 || 'si'; if (g === 'superado') return 3; if (g !== 'si') return 0; }
  if (f.kind === 'C' && ev.gates.g3 !== 'si') return 0;
  if (ev.ans[f.id] !== 'si') return 0;
  let best = 0;
  for (const cat of Object.keys(f.cats)) {
    if (f.kind === 'C' && CAT_LVL[cat] !== L) continue;
    f.cats[cat].forEach((_, i) => { const v = ev.beh[f.id + '|' + cat + '|' + i] || 0; if (v > best) best = v; });
  }

}
function allCells(ev) { const out = []; ROWS.forEach(r => r.cells.forEach(c => out.push({ lvl: r.lvl, ...c, st: stOf(ev, c.key) }))); return out; }
function applicable(ev) { return FUN.filter(f => !(f.kind === 'A' && ev.gates.g1 !== 'si') && !(f.kind === 'B' && (ev.gates.g2 || 'si') !== 'si') && !(f.kind === 'C' && ev.gates.g3 !== 'si')); }
function progress(ev) { const a = applicable(ev), done = a.filter(f => ev.ans[f.id]).length; return { done, total: a.length, pct: a.length ? Math.round(done * 100 / a.length) : 100 }; }
function counts(ev) { const c = [0,0,0,0]; allCells(ev).forEach(x => c[x.st]++); return c; }
/* Razones para comunicarse sobre las 80 celdas: Rechazar 7, Obtener 31, Social 28, Información 14 */
const AB_GRP = { A1: 'Rechazar', B1: 'Rechazar', A2: 'Obtener', B2: 'Obtener', B3: 'Obtener', A3: 'Social', B4: 'Social' };
const grpOfCode = code => AB_GRP[code] || groupOf(+code.slice(1));
const cellLevel = key => key.includes('@') ? +key.split('@')[1] : (key[0] === 'A' ? 1 : 2);
function cellBehs(f, L) {
  const out = [];
  CAT_ORDER.filter(cat => f.cats[cat] && (f.kind !== 'C' || CAT_LVL[cat] === L)).forEach(cat => f.cats[cat].forEach((t, i) => out.push({ k: f.id + '|' + cat + '|' + i, t, cat })));
  return out;
}
function cellPct(ev, key) {
  const st = stOf(ev, key); if (st === 3) return 100;
  const f = cellFun(key), bs = cellBehs(f, cellLevel(key));
  if (ev.ans[f.id] !== 'si' || !bs.length) return 0;
  return Math.round(100 * bs.reduce((a, b) => a + (ev.beh[b.k] || 0), 0) / (2 * bs.length));
}
function groupStats(ev) {
  const cells = allCells(ev);
  return GROUPS.map(g => { const cs = cells.filter(x => grpOfCode(x.code) === g.name), n = cs.length, d = cs.filter(x => x.st === 2).length, e = cs.filter(x => x.st === 1).length, s = cs.filter(x => x.st === 3).length;
    return { name: g.name, total: n, dom: d, em: e, sup: s, pctDom: Math.round(100 * d / n), pctEm: Math.round(100 * e / n), pctSup: Math.round(100 * s / n) }; });
}
function scoreInfo(ev) {

  const lv = [1,2,3,4,5,6,7].map(L => { const cs = cells.filter(x => x.lvl === L); return { L, n: cs.length, dom: cs.filter(x => x.st === 2).length, em: cs.filter(x => x.st === 1).length }; });
  let primary = 0, best = 0; lv.forEach(o => { const p = o.dom / o.n; if (o.dom > 0 && p >= best) { best = p; primary = o.L; } });
  const topStrict = Math.max(0, ...lv.filter(o => o.dom > 0).map(o => o.L)), topLoose = Math.max(0, ...lv.filter(o => o.dom + o.em > 0).map(o => o.L));

  <ul><li>Solo hace la conducta cuando hay otra persona presente (salvo las vocalizaciones pensadas para llamar a alguien que está lejos).</li>

  <li>Insiste, o lo intenta de otra forma, si no le responden.</li>

  if (b.dataset.dom) return paintDomain(+b.dataset.dom);
  switch (b.dataset.act) {
    case 'home': return go({ view: 'home', formFor: null });
    case 'backToChild': return go({ view: 'child', formFor: null });
    case 'newChild': ui.formFor = 'new'; return showChildForm(null);
    case 'editChild': ui.formFor = 'edit'; return showChildForm(childOf(ui.childId));
    case 'cancelForm': ui.formFor = null; return render();
    case 'editRow': { ui.formFor = null; const c = childOf(b.dataset.cid); if (!c) return; showChildForm(c); $('#formSlot').scrollIntoView({ behavior: 'smooth' }); return; }
    case 'delChild': { const c = childOf(b.dataset.cid || ui.childId); if (!c) return; const n = evalsOf(c.id).length; if (await ask('¿Eliminar a <b>' + esc(c.name) + '</b> y sus ' + n + ' evaluaciones? No se puede deshacer.', 'Sí, eliminar', true)) { db.evals = db.evals.filter(x => x.childId !== c.id); db.children = db.children.filter(x => x.id !== c.id); persist(); toast('Eliminado'); go({ view: 'home', formFor: null }); } return; }
    case 'newEval': { const n = newEval(ui.childId); return go({ view: 'wiz', evalId: n.id, step: null }); }
    case 'newFromLast': { const l = evalsOf(ui.childId)[0]; if (!l) return; const n = newEval(ui.childId, l); toast('Nueva evaluación con las respuestas de la última'); return go({ view: 'wiz', evalId: n.id, step: null }); }
    case 'fromEval': { const n = newEval(ui.childId, e()); toast('Nueva evaluación con las respuestas de la elegida'); return go({ view: 'wiz', evalId: n.id, step: null }); }
    case 'openEval': return go({ view: 'wiz', evalId: b.dataset.ev, step: null });
    case 'openRes': return go({ view: 'res', evalId: b.dataset.ev, cmpId: null });
    case 'openDash': return go({ view: 'dash', evalId: b.dataset.ev, cmpId: null });
    case 'toDash': return go({ view: 'dash' });
    case 'toRes': return go({ view: 'res' });
    case 'toWiz': return go({ view: 'wiz', step: null });
    case 'delEval': { const E = e(); if (await ask('¿Eliminar la evaluación del <b>' + fmtDate(E.date) + '</b>? No se puede deshacer.', 'Sí, eliminar', true)) { db.evals = db.evals.filter(x => x.id !== E.id); persist(); toast('Evaluación eliminada'); render(); } return; }
    case 'prev': case 'next': { const E = e(), st = stepList(E), i = st.findIndex(s => s.id === ui.step), t = st[i + (b.dataset.act === 'next' ? 1 : -1)]; if (t) { ui.step = t.id; paintStep(); window.scrollTo(0, 0); } return; }
    case 'pdfM': case 'pdfD': case 'pdfS': {
      if (!window.jspdf) return toast('No se cargó la librería de PDF. Revisa tu conexión.');
      const E = e(), c = childOf(E.childId); b.disabled = true; const old = b.textContent; b.textContent = 'Generando…';
      try { if (b.dataset.act === 'pdfM') await saveFile('Matriz_' + slug(c.name) + '_' + E.date + '.pdf', await makeMatrixPdf(E, c)); else if (b.dataset.act === 'pdfS') await saveFile('Destrezas_' + slug(c.name) + '_' + E.date + '.pdf', await makeSkillsPdf(E, c)); else { if (!window.Chart) throw new Error('Gráficos no disponibles'); await saveFile('Dashboard_' + slug(c.name) + '_' + E.date + '.pdf', await makeDashPdf(E, c, b.dataset.ev ? null : ui.cmpId)); } }
      catch (err) { console.error(err); toast('No se pudo generar el PDF: ' + err.message); }
      b.disabled = false; b.textContent = old; return; }
    case 'informe': { if (!window.jspdf) return toast('No se cargó la librería de PDF. Revisa tu conexión.'); const E = e(); if (!E) return; return showInforme(E, childOf(E.childId)); }
    case 'guide': return showGuide();
    case 'connect': return connectFolder(false);
    case 'changeFolder': return connectFolder(true);
    case 'backup': return doBackup();
    case 'import': return $('#impFile').click();
    case 'xlsx': { if (!window.XLSX) return toast('No se cargó la librería de Excel. Revisa tu conexión.'); if (!db.evals.length) return toast('Aún no hay evaluaciones para exportar.'); return void saveFile('Evaluaciones_matriz_' + today() + '.xlsx', xlsxData()); }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'impFile' && t.files[0]) { doImport(t.files[0]); t.value = ''; return; }
  const E = db.evals.find(x => x.id === ui.evalId); if (!E || ui.view !== 'wiz') return;
  if (t.matches('[data-yn]')) { E.ans[ui.step] = t.value; $('#behs').hidden = t.value !== 'si'; $('#ynHint').hidden = t.value !== 'no'; }
  else if (t.matches('[data-b]')) { E.beh[t.dataset.b] = +t.value; }
  else if (t.matches('[data-g]')) { E.gates[t.dataset.g] = t.value; E.updated = Date.now(); persist(); return paintStep(); }
  else if (t.id === 'evDate') { E.date = t.value || today(); }
  else if (t.id === 'evWho') { E.evaluator = t.value.trim(); db.evaluator = E.evaluator; }
  else return;
  E.updated = Date.now(); persist(); paintBar(); paintNav();
});
let txT;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { ui.q = t.value; return paintChildList(); }
  if (t.matches('[data-c]')) { const E = db.evals.find(x => x.id === ui.evalId); if (!E) return; if (t.value) E.comments[t.dataset.c] = t.value; else delete E.comments[t.dataset.c]; E.updated = Date.now(); clearTimeout(txT); txT = setTimeout(persist, 400); }
});
render();
initFolder();
</script>

</body></html>
